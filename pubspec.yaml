name: ish_tissuemap_fusion
description: Production-oriented hybrid phone and medical-device sensing platform.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  sensors_plus: ^6.1.1
  vector_math: ^2.1.4
  camera: ^0.11.4
  flutter_sound: ^9.30.0
  tflite_flutter: ^0.12.1
  charts_flutter: ^0.12.0
  google_ml_kit: ^0.20.1
  image: ^4.5.4
  image_picker: ^1.1.2
  flutter_local_notifications: ^19.4.2
  flutter_tts: ^4.2.3
  speech_to_text: ^7.4.0
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  http: ^1.5.0
  pdf: ^3.11.3
  path_provider: ^2.1.5
  flutter_blue_plus: ^1.35.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
