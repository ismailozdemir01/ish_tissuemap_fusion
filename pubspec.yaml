name: ish_tissuemap_fusion
description: ISH TissueMap Fusion - Hibrit Akustik ve EMF Vücut Tarayıcı
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Temel UI ve Yardımcılar
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # Sensör Okumaları
  sensors_plus: ^6.0.1
  flutter_sound: ^9.2.13
  permission_handler: ^11.3.0

  # İletişim
  flutter_blue_plus: ^1.32.0
  usb_serial: ^0.6.0

  # Matematik ve Görüntü İşleme
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/body_template.png
